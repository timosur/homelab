apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp-backends
  namespace: agentgateway-system
spec:
  mcp:
    prefixMode: Never
    targets:
      - name: obscura
        static:
          host: obscura.agentgateway-system.svc.cluster.local
          port: 8080
          protocol: StreamableHTTP
          policies:
            auth:
              credentials:
                - secretRef:
                    name: agentgateway-mcp-api-keys
                    key: obscura-mcp-token
                  location:
                    header:
                      name: Authorization
                      prefix: "Bearer "
      - name: context7
        static:
          host: mcp.context7.com
          port: 443
          protocol: StreamableHTTP
          policies:
            tls:
              sni: mcp.context7.com
            auth:
              credentials:
                - secretRef:
                    name: agentgateway-mcp-api-keys
                    key: context7-api-key
                  location:
                    header:
                      name: Authorization
                      prefix: "Bearer "
      - name: kagi
        static:
          host: mcp.kagi.com
          port: 443
          protocol: StreamableHTTP
          policies:
            tls:
              sni: mcp.kagi.com
            auth:
              credentials:
                - secretRef:
                    name: agentgateway-mcp-api-keys
                    key: kagi-api-key
                  location:
                    header:
                      name: Authorization
                      prefix: "Bearer "
      - name: penpot
        static:
          host: penpot-mcp.penpot.svc.cluster.local
          port: 4401
          path: /mcp
          protocol: StreamableHTTP
          policies:
            auth:
              credentials:
                - secretRef:
                    name: agentgateway-mcp-api-keys
                    key: penpot-mcp-key
                  location:
                    queryParameter:
                      name: userToken
