apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-platform-lab-secret
  namespace: agentgateway-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: agentgateway-platform-lab-secret
    creationPolicy: Owner
  data:
    - secretKey: Authorization
      remoteRef:
        key: agentgateway-platform-lab-api-key
