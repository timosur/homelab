# Platform Lab model, exposed as platform-lab-qwen38-flash-spark and forwarded as qwen38-flash-spark.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: platform-lab-qwen38-flash-spark
  namespace: agentgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
      sectionName: https
  provider: OpenAI
  baseURL: https://agentgateway.app.lab.internal
  policies:
    auth:
      secretRef:
        name: agentgateway-platform-lab-secret
    tls:
      caCertificateRefs:
        - name: platform-lab-ca
    transformations:
      - field: model
        expression: '"qwen38-flash-spark"'
