apiVersion: apps/v1
kind: Deployment
metadata:
  name: obscura
  namespace: agentgateway-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: obscura
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obscura
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab-amd
      containers:
        - name: obscura
          image: h4ckf0r0day/obscura:0.2.5@sha256:354c3d2a0fa2dd2939debe6903aa26c35d121329245dfa42aa7d1c292a209814
          args:
            - mcp
            - --http
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --stealth
          ports:
            - name: mcp
              containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
