apiVersion: apps/v1
kind: Deployment
metadata:
  name: obscura
  namespace: agentgateway-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: obscura
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obscura
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab-amd
      containers:
        - name: obscura
          image: h4ckf0r0day/obscura:0.2.6@sha256:76522dd288b0c0186b360fd6e6133ef55908e1fc3b9c4b7ad6240bf8682d998c
          args:
            - mcp
            - --http
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --stealth
          env:
            - name: OBSCURA_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentgateway-mcp-api-keys
                  key: obscura-mcp-token
          ports:
            - name: mcp
              containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
