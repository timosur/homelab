apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: agentgateway-proxy-params
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
          - group: agentgateway.dev
            kind: AgentgatewayModel
    - name: https
      protocol: HTTPS
      port: 443
      hostname: inference.ai.home.timosur.com
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: agentgateway-inference-tls
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: agentgateway.dev
            kind: AgentgatewayModel
    - name: mcp-https
      protocol: HTTPS
      port: 443
      hostname: mcp.ai.home.timosur.com
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: agentgateway-inference-tls
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
