apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: penpot
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.penpot.app
      chart: penpot
      targetRevision: 1.11.9
      helm:
        valuesObject:
          config:
            publicUri: https://penpot.home.timosur.com
            flags: "enable-registration enable-login-with-password enable-login-with-oidc disable-email-verification enable-mcp"
            existingSecret: penpot-secrets
            secretKeys:
              apiSecretKey: apiSecretKey
            telemetryEnabled: false
            postgresql:
              host: central-postgres-rw.postgres.svc.cluster.local
              database: penpot
              existingSecret: penpot-db-connection
              secretKeys:
                usernameKey: username
                passwordKey: password
            redis:
              host: penpot-valkey.penpot.svc.cluster.local
          persistence:
            assets:
              storageClass: homelab-smb
              size: 20Gi
          backend:
            extraEnvs:
              - name: PENPOT_DATABASE_MIN_POOL_SIZE
                value: "2"
              - name: PENPOT_DATABASE_MAX_POOL_SIZE
                value: "20"
              # authentik OIDC. Not config.providers.oidc: that chart template makes the secretKeyRef
              # non-optional, so a missing secret would stop the backend from starting.
              # Discovery (.well-known) runs once at backend start; restart the backend after the provider exists.
              - name: PENPOT_OIDC_BASE_URI
                value: https://auth.timosur.com/application/o/penpot/
              - name: PENPOT_OIDC_CLIENT_ID
                value: penpot
              # Penpot's SSRF guard blocks hosts that resolve to private addresses, which would break discovery
              # if auth.timosur.com resolves to a LAN IP (split DNS). Exact, case-insensitive host match.
              - name: PENPOT_SSRF_ALLOWED_HOSTS
                value: auth.timosur.com
              - name: PENPOT_OIDC_SCOPES
                value: openid profile email
              - name: PENPOT_OIDC_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: penpot-oidc
                    key: clientSecret
                    optional: true
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 3Gi
          frontend:
            # Stock template runs one ~30Mi worker per node CPU and OOMs; see apps/penpot/kustomization.yaml
            volumes:
              - name: nginx-template
                configMap:
                  name: penpot-frontend-nginx
            volumeMounts:
              - name: nginx-template
                mountPath: /tmp/nginx.conf.template
                subPath: nginx.conf.template
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
          mcp:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
          exporter:
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    - repoURL: https://github.com/timosur/homelab.git
      targetRevision: HEAD
      path: apps/penpot
  destination:
    server: https://kubernetes.default.svc
    namespace: penpot
  ignoreDifferences:
    - group: k8s.homelab.timosur.com
      kind: AppDBClaim
      jsonPointers:
        - /metadata
        - /spec
        - /status
    - group: k8s.homelab.timosur.com
      kind: AppDB
      jsonPointers:
        - /metadata
        - /spec
        - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
