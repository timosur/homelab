apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dark-factory
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/prskr/dark-factory.git
      targetRevision: 3089ad9e2d4eba98f2421a978bf814acfabf05e4
      path: deploy/helm/dark-factory
      helm:
        releaseName: dark-factory
        valueFiles:
          - $values/apps/dark-factory/values.yaml
    - repoURL: https://github.com/timosur/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dark-factory
