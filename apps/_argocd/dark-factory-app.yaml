apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dark-factory
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/prskr/dark-factory.git
      targetRevision: e42d4da438ec8ddbe5d7bc82403f3e0a7a0add2d
      path: deploy/helm/dark-factory
      helm:
        releaseName: dark-factory
        valueFiles:
          - $values/apps/dark-factory/values.yaml
    - repoURL: https://github.com/timosur/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dark-factory
