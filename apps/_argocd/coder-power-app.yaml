apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder-power
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/timosur/homelab.git
    targetRevision: HEAD
    path: apps/coder/power-coordination
  destination:
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: ''
      kind: ConfigMap
      name: coder-power-trust
      namespace: coder
      jsonPointers: [/data]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
