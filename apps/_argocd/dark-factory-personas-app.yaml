apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dark-factory-personas
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/timosur/homelab.git
    targetRevision: HEAD
    path: apps/dark-factory-personas
  destination:
    server: https://kubernetes.default.svc
    namespace: dark-factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
