apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dark-factory-wake
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/timosur/homelab.git
    targetRevision: HEAD
    path: apps/dark-factory-wake
  destination:
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: ''
      kind: ConfigMap
      name: dark-factory-interlock
      namespace: wol-proxy
      jsonPointers: [/data]
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
