apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pangolin-newt-auth
  namespace: newt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: pangolin-newt-auth
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data:
        PANGOLIN_ENDPOINT: https://dashboard.pangolin.timosur.com
  data:
    - secretKey: NEWT_ID
      remoteRef:
        key: pangolin-newt-id
    - secretKey: NEWT_SECRET
      remoteRef:
        key: pangolin-newt-secret
