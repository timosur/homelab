apiVersion: v1
kind: ServiceAccount
metadata:
  name: pangolin-routes
  namespace: newt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pangolin-routes
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pangolin-routes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pangolin-routes
subjects:
  - kind: ServiceAccount
    name: pangolin-routes
    namespace: newt
