apiVersion: v1
kind: ConfigMap
metadata:
  name: dark-factory-interlock
  namespace: wol-proxy
data:
  epoch: '0'
  owner: ''
  phase: idle
  http_active: '0'
  workspace_records: '{}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dark-factory-interlock
  namespace: wol-proxy
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [dark-factory-interlock]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dark-factory-interlock
  namespace: wol-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dark-factory-interlock
subjects:
  - kind: ServiceAccount
    name: wol-proxy
    namespace: wol-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dark-factory-desktop-lease-reader
  namespace: kube-node-lease
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [homelab-amd-desktop, homelab-gpu]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dark-factory-desktop-lease-reader
  namespace: kube-node-lease
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dark-factory-desktop-lease-reader
subjects:
  - kind: ServiceAccount
    name: wol-proxy
    namespace: wol-proxy
