apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wol-proxy-desktop-known-hosts
  namespace: wol-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: wol-proxy-desktop-known-hosts
    creationPolicy: Owner
  data:
    - secretKey: known_hosts
      remoteRef:
        key: wol-proxy-desktop-known-hosts
