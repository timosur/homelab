apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: dark-factory-sandbox-gate
  annotations:
    cert-manager.io/inject-ca-from: wol-proxy/dark-factory-admission-tls
webhooks:
  - name: mutate.sandbox-gate.home.timosur.com
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: dark-factory-sandboxes
    clientConfig:
      service:
        name: dark-factory-admission
        namespace: wol-proxy
        path: /mutate
        port: 443
    rules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
        scope: Namespaced
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [persistentvolumeclaims]
        scope: Namespaced
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: dark-factory-sandbox-gate
  annotations:
    cert-manager.io/inject-ca-from: wol-proxy/dark-factory-admission-tls
webhooks:
  - name: validate.sandbox-gate.home.timosur.com
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: dark-factory-sandboxes
    clientConfig:
      service:
        name: dark-factory-admission
        namespace: wol-proxy
        path: /validate
        port: 443
    rules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
        scope: Namespaced
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods/binding, bindings]
        scope: Namespaced
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [persistentvolumeclaims]
        scope: Namespaced
