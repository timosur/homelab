apiVersion: v1
kind: Service
metadata:
  name: dark-factory-admission
  namespace: wol-proxy
spec:
  selector:
    app: wol-proxy
  ports:
    - name: https
      port: 443
      targetPort: admission
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dark-factory-admission-apiserver
  namespace: wol-proxy
spec:
  endpointSelector:
    matchLabels:
      app: wol-proxy
  ingress:
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - port: '9443'
              protocol: TCP
