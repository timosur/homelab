apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-secrets
  namespace: coder
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: coder-secrets
    creationPolicy: Owner
  data:
    - secretKey: CODER_OIDC_CLIENT_ID
      remoteRef:
        key: coder-oidc-client-id
    - secretKey: CODER_OIDC_CLIENT_SECRET
      remoteRef:
        key: coder-oidc-client-secret
    - secretKey: CODER_EXTERNAL_AUTH_0_CLIENT_ID
      remoteRef:
        key: coder-github-oauth-client-id
    - secretKey: CODER_EXTERNAL_AUTH_0_CLIENT_SECRET
      remoteRef:
        key: coder-github-oauth-client-secret
