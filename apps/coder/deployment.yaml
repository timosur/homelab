apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder
  namespace: coder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coder
  template:
    metadata:
      labels:
        app: coder
    spec:
      serviceAccountName: coder
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coder
          image: ghcr.io/coder/coder:v2.38.6@sha256:c9245405c482ede17699d65deb8c21488a17feff5497fc84d6a350c395da2bdd
          envFrom:
            - configMapRef:
                name: coder-config
            - secretRef:
                name: coder-secrets
          env:
            - name: CODER_PG_CONNECTION_URL
              valueFrom:
                secretKeyRef:
                  name: coder-db-connection
                  key: uri
          ports:
            - name: http
              containerPort: 7080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: power-preflight
              mountPath: /run/coder-power
              readOnly: true
            - name: power-trust
              mountPath: /run/coder-power-ca
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: power-preflight
          secret:
            secretName: coder-power-preflight
            optional: true
        - name: power-trust
          configMap:
            name: coder-power-trust
            optional: true
