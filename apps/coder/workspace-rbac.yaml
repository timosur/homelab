apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-workspace-provisioner
  namespace: coder
rules:
  - apiGroups: [""]
    resources:
      - pods
      - persistentvolumeclaims
    verbs:
      - create
      - delete
      - get
      - list
      - watch
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims/finalizers
    verbs:
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-workspace-provisioner
  namespace: coder
subjects:
  - kind: ServiceAccount
    name: coder
    namespace: coder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-workspace-provisioner
