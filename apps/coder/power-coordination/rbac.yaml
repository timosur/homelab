apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-power-coordinator
  namespace: coder
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, patch]
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [coder-power-trust]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-power-coordinator
  namespace: coder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-power-coordinator
subjects:
  - kind: ServiceAccount
    name: wol-proxy
    namespace: wol-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coder-power-admission-reader
rules:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    resourceNames: [coder-workspace-gate]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coder-power-admission-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: coder-power-admission-reader
subjects:
  - kind: ServiceAccount
    name: wol-proxy
    namespace: wol-proxy
