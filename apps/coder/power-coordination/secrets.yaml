apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-power-preflight
  namespace: coder
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: coder-power-preflight
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: coder-power-preflight-token
---
