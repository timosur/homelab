<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SOS Unavailable</title>
    <style>
      body {
        margin: 0;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        background: #f4f6f8;
        color: #1a1d21;
      }
      main {
        max-width: 760px;
        margin: 4rem auto;
        padding: 1rem;
      }
      .box {
        border: 2px solid #b00020;
        background: #ffe9ec;
        border-radius: 12px;
        padding: 1rem;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 1rem;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-block;
        padding: 0.6rem 0.9rem;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 700;
        background: #b00020;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="box">
        <h1>Notfallinformationen temporaer nicht verfuegbar</h1>
        <p><strong>DE:</strong> Notfallinformationen sind momentan nicht verfuegbar. Bitte direkt Notruf waehlen.</p>
        <p><strong>EN:</strong> Emergency information is temporarily unavailable. Please call emergency services directly.</p>
        <div class="actions">
          <a class="btn" href="tel:112">112 Feuerwehr/Rettung/Notarzt</a>
          <a class="btn" href="tel:110">110 Polizei</a>
        </div>
      </section>
    </main>
  </body>
</html>
