apiVersion: apps/v1
kind: Deployment
metadata:
  name: sos
  namespace: sos
  labels:
    app: sos
  annotations:
    secret.reloader.stakater.com/reload: "sos-page-data"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sos
  template:
    metadata:
      labels:
        app: sos
      annotations:
        secret.reloader.stakater.com/reload: "sos-page-data"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
        - name: render-sos-page
          image: alpine:3.22.1
          command:
            - sh
            - -ec
            - |
              apk add --no-cache jq
              /renderer/render.sh
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: page-data
              mountPath: /data
              readOnly: true
            - name: rendered-page
              mountPath: /work
            - name: renderer
              mountPath: /renderer
              readOnly: true
            - name: apk-cache
              mountPath: /etc/apk/cache
            - name: apk-lib
              mountPath: /var/lib/apk
            - name: apk-tmp
              mountPath: /tmp
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29.1-alpine3.22
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: rendered-page
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-cache
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: page-data
          secret:
            secretName: sos-page-data
            optional: true
        - name: rendered-page
          emptyDir: {}
        - name: renderer
          configMap:
            name: sos-renderer
            defaultMode: 0755
        - name: nginx-config
          configMap:
            name: sos-nginx-config
        - name: nginx-cache
          emptyDir: {}
        - name: apk-cache
          emptyDir: {}
        - name: apk-lib
          emptyDir: {}
        - name: apk-tmp
          emptyDir: {}
