# ArgoCD's authentik OIDC client secret. Same Key Vault entry as authentik-oidc-secrets.
# Separate Secret (not argocd-secret). ArgoCD only reads Secrets labelled
# app.kubernetes.io/part-of: argocd, referenced in argocd-cm as $argocd-oidc:clientSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: argocd-oidc
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: clientSecret
      remoteRef:
        key: argocd-oidc-client-secret
