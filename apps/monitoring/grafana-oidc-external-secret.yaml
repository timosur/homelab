# Grafana's authentik OIDC client secret. Same Key Vault entry as authentik-oidc-secrets.
# Consumed by the grafana pod via envValueFrom (optional: true) in _argocd/monitoring-app.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: grafana-oidc-client-secret
