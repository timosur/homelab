apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: dark-factory-nfs
provisioner: nfs.csi.k8s.io
parameters:
  server: 192.168.1.26
  share: /volume1/k3s_nfs
  onDelete: delete
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.1
