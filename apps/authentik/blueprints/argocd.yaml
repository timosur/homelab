# ArgoCD OIDC provider + application.
# The client secret is read from the worker environment (!Env) and is never stored in Git.
# It comes from ExternalSecret authentik-oidc-secrets (Key Vault: argocd-oidc-client-secret).
# Every entry has a condition on that variable: if it is unset or empty (secret not yet created),
# the entries are skipped, so no provider with an empty/default secret is ever created.
# No custom scope mapping: ArgoCD does not check email_verified and no groups are used (see README, "ArgoCD user behaviour").
version: 1
metadata:
  name: ArgoCD OIDC
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    conditions:
      - !Env [ARGOCD_OIDC_CLIENT_SECRET, ""]
    identifiers:
      name: ArgoCD
    attrs:
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: argocd
      client_secret: !Env ARGOCD_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        # ArgoCD sends redirect_uri=<url>/auth/callback.
        - matching_mode: strict
          url: https://argo.home.timosur.com/auth/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
  - model: authentik_core.application
    id: application
    conditions:
      - !Env [ARGOCD_OIDC_CLIENT_SECRET, ""]
    identifiers:
      slug: argocd
    attrs:
      name: ArgoCD
      provider: !KeyOf provider
      meta_launch_url: https://argo.home.timosur.com
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    conditions:
      - !Env [ARGOCD_OIDC_CLIENT_SECRET, ""]
    identifiers:
      target: !KeyOf application
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, board-member]]
