# Client secrets for blueprint-managed OIDC providers. Exposed to the worker as env vars
# and read by blueprints via !Env. The app namespace reads the same Key Vault entry.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-oidc-secrets
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: authentik-oidc-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPEN_WEBUI_OIDC_CLIENT_SECRET
      remoteRef:
        key: open-webui-oidc-client-secret
    - secretKey: PAPERLESS_OIDC_CLIENT_SECRET
      remoteRef:
        key: paperless-oidc-client-secret
    - secretKey: MEALIE_OIDC_CLIENT_SECRET
      remoteRef:
        key: mealie-oidc-client-secret
    - secretKey: GRAFANA_OIDC_CLIENT_SECRET
      remoteRef:
        key: grafana-oidc-client-secret
    - secretKey: ARGOCD_OIDC_CLIENT_SECRET
      remoteRef:
        key: argocd-oidc-client-secret
