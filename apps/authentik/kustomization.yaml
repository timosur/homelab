apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik

resources:
  - namespace.yaml
  - configmap.yaml
  - external-secret.yaml
  - appdb.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - server-deployment.yaml
  - server-service.yaml
  - worker-deployment.yaml
  - media-pvc.yaml
  - reference-grant.yaml

configMapGenerator:
  - name: authentik-coder-email
    files:
      - coder-email/blueprint.yaml
      - coder-email/snapshot.expr
      - coder-email/record.expr
      - coder-email/scope.expr
