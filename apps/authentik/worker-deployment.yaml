apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  namespace: authentik
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authentik-worker
  template:
    metadata:
      labels:
        app: authentik-worker
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab-amd
      containers:
        - name: worker
          image: ghcr.io/goauthentik/server:2026.8.6
          command: ["ak", "worker"]
          envFrom:
            - configMapRef:
                name: authentik-config
            - secretRef:
                name: authentik-secrets
          env:
            - name: AUTHENTIK_EMAIL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: AUTHENTIK_EMAIL__PASSWORD
            - name: AUTHENTIK_POSTGRESQL__USER
              valueFrom:
                secretKeyRef:
                  name: authentik-db-connection
                  key: username
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-db-connection
                  key: password
            - name: OPEN_WEBUI_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authentik-oidc-secrets
                  key: OPEN_WEBUI_OIDC_CLIENT_SECRET
          volumeMounts:
            - name: media
              mountPath: /media
            - name: coder-email-blueprint
              mountPath: /blueprints/coder-email
              readOnly: true
            - name: oidc-blueprints
              mountPath: /blueprints/oidc
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: authentik-media
        - name: coder-email-blueprint
          configMap:
            name: authentik-coder-email
        - name: oidc-blueprints
          configMap:
            name: authentik-oidc-blueprints
