# authentik OIDC client secret for Mealie. Same Key Vault entry the authentik worker reads
# (see apps/authentik/blueprints/README.md). Never put this value in the ConfigMap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-oidc
  namespace: mealie
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: mealie-oidc
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: mealie-oidc-client-secret
