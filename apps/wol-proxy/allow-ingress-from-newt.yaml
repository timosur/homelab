apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-newt
  namespace: wol-proxy
spec:
  description: "Allow the Pangolin newt tunnel to reach the desktop proxy (e.g. docs.timosur.com)"
  endpointSelector:
    matchLabels:
      app: wol-proxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: newt
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
