apiVersion: apps/v1
kind: Deployment
metadata:
  name: wol-proxy
  namespace: wol-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wol-proxy
  template:
    metadata:
      labels:
        app: wol-proxy
      annotations:
        coder.home.timosur.com/power-integration: "enabled"
    spec:
      serviceAccountName: wol-proxy
      securityContext:
        fsGroup: 1000
      # Run on control plane (always on)
      nodeSelector:
        kubernetes.io/hostname: homelab-amd
      initContainers:
        - name: fix-ssh-key-perms
          image: busybox
          command:
            - sh
            - -c
            - |
              base64 -d /ssh-secret/ssh-key > /ssh-key/ssh-key
              chown 1000:1000 /ssh-key/ssh-key
              chmod 400 /ssh-key/ssh-key
          volumeMounts:
            - name: ssh-key-secret
              mountPath: /ssh-secret
              readOnly: true
            - name: ssh-key
              mountPath: /ssh-key
        - name: prepare-desktop-power-key
          image: busybox
          command:
            - sh
            - -c
            - |
              set -eu
              if [ -s /power-secret/ssh-key ]; then
                base64 -d /power-secret/ssh-key > /power-key/id
                chown 1000:1000 /power-key/id
                chmod 400 /power-key/id
              fi
          volumeMounts:
            - name: desktop-power-secret
              mountPath: /power-secret
              readOnly: true
            - name: desktop-power-key
              mountPath: /power-key
        - name: prepare-gpu-power-key
          image: busybox
          command:
            - sh
            - -c
            - |
              set -eu
              if [ -s /power-secret/ssh-key ]; then
                base64 -d /power-secret/ssh-key > /power-key/id
                chown 1000:1000 /power-key/id
                chmod 400 /power-key/id
              fi
          volumeMounts:
            - name: gpu-power-secret
              mountPath: /power-secret
              readOnly: true
            - name: gpu-power-key
              mountPath: /power-key
      containers:
        - name: wol-proxy
          image: ghcr.io/timosur/homelab/wol-proxy:sha-de09a79@sha256:c1d56ddbe14afac0eacac092f95e1c05c3b19a9d2d71e4fb3d6de47945ed79a2
          ports:
            - containerPort: 11434
              name: ollama
            - containerPort: 8080
              name: desktop
            - containerPort: 9443
              name: admission
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 192Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: ssh-key
              mountPath: /secrets
              readOnly: true
            - name: admission-tls
              mountPath: /run/dark-factory-admission
              readOnly: true
            - name: desktop-known-hosts
              mountPath: /run/desktop-ssh
              readOnly: true
            - name: desktop-power-key
              mountPath: /run/desktop-power-ssh
              readOnly: true
            - name: gpu-known-hosts
              mountPath: /run/gpu-ssh
              readOnly: true
            - name: gpu-power-key
              mountPath: /run/gpu-power-ssh
              readOnly: true
            - name: coder-preflight
              mountPath: /run/coder-preflight
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: wol-proxy-config
        - name: ssh-key-secret
          secret:
            secretName: wol-proxy-ssh-key
        - name: ssh-key
          emptyDir: {}
        - name: admission-tls
          secret:
            secretName: dark-factory-admission-tls
            optional: true
            defaultMode: 288
        - name: desktop-known-hosts
          secret:
            secretName: wol-proxy-desktop-known-hosts
            optional: true
            defaultMode: 288
        - name: desktop-power-secret
          secret:
            secretName: wol-proxy-desktop-power-ssh-key
            optional: true
        - name: desktop-power-key
          emptyDir:
            medium: Memory
        - name: gpu-known-hosts
          secret:
            secretName: wol-proxy-gpu-known-hosts
            optional: true
            defaultMode: 288
        - name: gpu-power-secret
          secret:
            secretName: wol-proxy-gpu-power-ssh-key
            optional: true
        - name: gpu-power-key
          emptyDir:
            medium: Memory
        - name: coder-preflight
          secret:
            secretName: coder-power-preflight
            optional: true
            defaultMode: 288
