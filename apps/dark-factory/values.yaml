fullnameOverride: dark-factory

image:
  controlPlane:
    digest: sha256:8b0eeb0b84e8698d98efb4b7ed3d2bf1b8b67d090f2a83c09b82dc7dc16f5ff3
  runtime:
    digest: sha256:edfe67804857a7345c3ba3a7537da9a7004ffff9b2e6fc008233c72c909ec975
  harness:
    claudeCode:
      digest: sha256:528c382e92527df7f85c019272060254e6885f63dc97e3d9f511edba280061f0
  testProject:
    digest: sha256:e8d3ae9416e7dc893c6f8ccba6d935dcfcd98cf4a93cea4a7dd8ed66a6117c1f

database:
  host: central-postgres-rw.postgres.svc.cluster.local
  database: dark-factory
  schema: dark_factory
  owner:
    user: dark-factory-owner
    existingSecret: dark-factory-db-connection
  app:
    user: dark-factory-app
    existingSecret: dark-factory-db-app
  migrate:
    manageAppRole: false

oidc:
  issuerUrl: https://auth.timosur.com/application/o/dark-factory/
  clientId: dark-factory
  existingSecret: dark-factory-oidc
  publicUrl: https://factory.home.timosur.com
  rolesClaim: groups
  extraScopes: [groups]

telemetry:
  metrics:
    serviceMonitor:
      enabled: true
      labels:
        release: monitoring

sandboxNamespace:
  name: dark-factory-sandboxes
  runtimeClassName: kata-dark-factory
  storageClass: dark-factory-nfs
  pvcSize: 20Gi
  resourceQuota:
    # User-authorized early real-task rollout; remaining acceptance gates are still open.
    pods: '2'
    requestsCpu: '2'
    requestsMemory: 4Gi
    limitsCpu: '4'
    limitsMemory: 8Gi
    requestsStorage: 200Gi
    # Retained per-task workspaces are independent of the two concurrent sandbox slots.
    persistentVolumeClaims: '10'
  limitRange:
    defaultCpu: '2'
    defaultMemory: 4Gi
    defaultRequestCpu: 250m
    defaultRequestMemory: 512Mi

plugins:
  forgejo: null
  github:
    image:
      digest: sha256:b46b87da22e639dd80f066013b0ad4b8cbca2a43f8bf587880bb227515749339

controlPlane:
  resources:
    limits:
      cpu: '1'

gateway:
  resources:
    limits:
      cpu: 500m

httpRoute:
  enabled: true
  parentRefs:
    - name: envoy-gateway-home
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - factory.home.timosur.com

networkPolicy:
  ingressController:
    namespaceSelector:
      kubernetes.io/metadata.name: envoy-gateway-system
  metricsScraper:
    namespaceSelector:
      kubernetes.io/metadata.name: monitoring
