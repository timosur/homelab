fullnameOverride: dark-factory

publicUrl: https://factory.home.timosur.com

image:
  controlPlane:
    digest: sha256:52c03be33853407ded0e043728463bb9ae47d31b827ac50ef7b1943c71e440ca
  runtime:
    digest: sha256:ad98ec36ef3617dd3a8241c1aba5b1df299a26b3b4b67a6353a3c8e6b2d7bed1
  harness:
    claudeCode:
      digest: sha256:efb64fb7a783b93b82463b4f60dfd5ccfb52418fe2316761561815674e4cef73
    opencode:
      digest: sha256:3bc45572888fa83fdf0229b984f4096c704d7b4f5cd09422f4c4b0a2c8f45e68
  testProject:
    digest: sha256:025b695a00984ab730a7b292605c514349ebd252d7a8fbb7e0b3f13792cb9141

database:
  host: central-postgres-rw.postgres.svc.cluster.local
  database: dark-factory
  schema: dark_factory
  owner:
    user: dark-factory-owner
    existingSecret: dark-factory-db-connection
  app:
    user: dark-factory-app
    existingSecret: dark-factory-db-app
  migrate:
    manageAppRole: false

oidc:
  issuerUrl: https://auth.timosur.com/application/o/dark-factory/
  clientId: dark-factory
  existingSecret: dark-factory-oidc
  rolesClaim: groups
  extraScopes: [groups]

telemetry:
  metrics:
    serviceMonitor:
      enabled: true
      labels:
        release: monitoring

sandbox:
  runtimeClassName: kata-dark-factory
  # Replaces the sandbox LimitRange the chart dropped in v2026.11.8. The memory request reflects a
  # realistic agent working set, so the scheduler spreads sandboxes across both workers.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 4Gi

sandboxNamespace:
  name: dark-factory-sandboxes
  storageClass: dark-factory-nfs
  pvcSize: 20Gi
  resourceQuota:
    # Eight concurrent sandboxes (tasks and chats share them). Each Kata VM gets 1 + 2 vCPUs, so
    # eight saturate the 24 cores of both workers. Quotas include the RuntimeClass overhead
    # (250m / 1Gi per pod): requests 8 x (500m, 2Gi), limits 8 x (2.25 CPU, 5Gi).
    pods: '8'
    requestsCpu: '4'
    requestsMemory: 16Gi
    limitsCpu: '18'
    limitsMemory: 40Gi
    # 20Gi per claim (40 workspaces). NFS does not enforce the claim size, so this overcommits the
    # dedicated export; its 500 GiB Synology quota caps real usage of git-checkout workspaces.
    requestsStorage: 800Gi
    # Retained per-task workspaces are independent of the concurrent sandbox slots.
    persistentVolumeClaims: '80'

# Task volumes only cache the checkout; the next run re-clones. Keep them short-lived so the
# storage quota is not filled by stale or failed tasks (failed tasks only expire via idleTtl).
volumes:
  retainAfterCloseSeconds: 86400 # 1 day after completed/cancelled/archived
  idleTtlSeconds: 604800 # 7 days after the last run of any task

# Matches the sandbox quota above; chats count against the same quota.
runs:
  maxConcurrent: 8
  maxConcurrentChats: 2

plugins:
  forgejo: null
  github:
    image:
      digest: sha256:2774ffd0458df13e7a27e9a1e1a5ef830c70d918316a15cc45c71b4905da25ca

controlPlane:
  resources:
    limits:
      cpu: '1'

gateway:
  # The chart default dropped to 1 in v2026.11.x; keep the previous two for HA.
  replicas: 2
  resources:
    limits:
      cpu: 500m

httpRoute:
  enabled: true
  parentRefs:
    - name: envoy-gateway-home
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - factory.home.timosur.com

networkPolicy:
  ingressController:
    namespaceSelector:
      kubernetes.io/metadata.name: envoy-gateway-system
  metricsScraper:
    namespaceSelector:
      kubernetes.io/metadata.name: monitoring
