fullnameOverride: dark-factory

publicUrl: https://factory.home.timosur.com

image:
  controlPlane:
    digest: sha256:4c9db10e7f072a8bbccbbf29f8fe53e0f734fc4b9b8a529718d840cb5b712b01
  runtime:
    digest: sha256:1165b9b2070877fbc5ee9882f921c5d42d5491ce23bb39932003c08fea5d843b
  harness:
    claudeCode:
      digest: sha256:efb64fb7a783b93b82463b4f60dfd5ccfb52418fe2316761561815674e4cef73
    opencode:
      digest: sha256:ecdceafb62298ec94bbf87e8e0a7db2ff4f70013d3c5f6e4b877c7129bf9c3d2
  testProject:
    digest: sha256:1c90e3a692f9af891b7049b3d0f7da5163d1b21a0dab69b0aae45c9ad2d81836

database:
  host: central-postgres-rw.postgres.svc.cluster.local
  database: dark-factory
  schema: dark_factory
  owner:
    user: dark-factory-owner
    existingSecret: dark-factory-db-connection
  app:
    user: dark-factory-app
    existingSecret: dark-factory-db-app
  migrate:
    manageAppRole: false

oidc:
  issuerUrl: https://auth.timosur.com/application/o/dark-factory/
  clientId: dark-factory
  existingSecret: dark-factory-oidc
  rolesClaim: groups
  extraScopes: [groups]

telemetry:
  metrics:
    serviceMonitor:
      enabled: true
      labels:
        release: monitoring

sandboxNamespace:
  name: dark-factory-sandboxes
  runtimeClassName: kata-dark-factory
  storageClass: dark-factory-nfs
  pvcSize: 20Gi
  resourceQuota:
    # Eight concurrent sandboxes (tasks and chats share them). Each Kata VM gets 1 + 2 vCPUs, so
    # eight saturate the 24 cores of both workers. Quotas include the RuntimeClass overhead
    # (250m / 1Gi per pod): requests 8 x (500m, 2Gi), limits 8 x (2.25 CPU, 5Gi).
    pods: '8'
    requestsCpu: '4'
    requestsMemory: 16Gi
    limitsCpu: '18'
    limitsMemory: 40Gi
    # 20Gi per claim; the NFS export has a 500 GiB aggregate cap.
    requestsStorage: 400Gi
    # Retained per-task workspaces are independent of the concurrent sandbox slots.
    persistentVolumeClaims: '80'
  limitRange:
    defaultCpu: '2'
    defaultMemory: 4Gi
    defaultRequestCpu: 250m
    # Realistic agent working set, so the scheduler spreads sandboxes across both workers.
    defaultRequestMemory: 1Gi

# Matches the sandbox quota above; chats count against the same quota.
runs:
  maxConcurrent: 8
  maxConcurrentChats: 2

plugins:
  forgejo: null
  github:
    image:
      digest: sha256:282f75e57f717a14a0f1b0928dd2fa4a2fa5e665f4747882f91ae586199d4d3f

controlPlane:
  resources:
    limits:
      cpu: '1'

gateway:
  # The chart default dropped to 1 in v2026.11.x; keep the previous two for HA.
  replicas: 2
  resources:
    limits:
      cpu: 500m

httpRoute:
  enabled: true
  parentRefs:
    - name: envoy-gateway-home
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - factory.home.timosur.com

networkPolicy:
  ingressController:
    namespaceSelector:
      kubernetes.io/metadata.name: envoy-gateway-system
  metricsScraper:
    namespaceSelector:
      kubernetes.io/metadata.name: monitoring
