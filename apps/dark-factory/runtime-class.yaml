apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-dark-factory
handler: kata
scheduling:
  nodeSelector:
    dark-factory.home.timosur.com/sandbox-worker: 'true'
  tolerations:
    - key: availability
      operator: Equal
      value: daytime
      effect: NoSchedule
    - key: gpu
      operator: Equal
      value: 'true'
      effect: NoSchedule
