apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-dark-factory
handler: kata
# Host cost of the Kata VM itself (measured ~770MiB idle RSS per sandbox), so the scheduler and the
# sandbox quota account for it.
overhead:
  podFixed:
    cpu: 250m
    memory: 1Gi
scheduling:
  nodeSelector:
    dark-factory.home.timosur.com/sandbox-worker: 'true'
  tolerations:
    - key: availability
      operator: Equal
      value: daytime
      effect: NoSchedule
    - key: gpu
      operator: Equal
      value: 'true'
      effect: NoSchedule
