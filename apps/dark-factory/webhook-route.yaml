# Public route for GitHub webhooks: only POST /webhooks/github reaches the control plane,
# everything else on factory-hooks.timosur.com gets a 404 from Envoy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dark-factory-webhooks
  namespace: dark-factory
spec:
  parentRefs:
    - name: envoy-gateway-dark-factory-webhook
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - factory-hooks.timosur.com
  rules:
    - matches:
        - method: POST
          path:
            type: Exact
            value: /webhooks/github
      backendRefs:
        - name: dark-factory-control-plane
          port: 8080
