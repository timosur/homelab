apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dark-factory-oidc
  namespace: dark-factory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: dark-factory-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: dark-factory-oidc-client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dark-factory-github
  namespace: dark-factory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: dark-factory-github
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: dark-factory-github-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dark-factory-claude
  namespace: dark-factory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: dark-factory-claude
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: dark-factory-claude-oauth-token
