apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-agentgateway
  namespace: claude-bridge
spec:
  endpointSelector:
    matchLabels:
      app: claude-bridge
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway-system
            app.kubernetes.io/name: agentgateway-proxy
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
