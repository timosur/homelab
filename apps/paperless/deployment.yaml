apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-redis
  namespace: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-redis
  template:
    metadata:
      labels:
        app: paperless-redis
    spec:
      # Pinned to the desktop: the arm nodes run out of memory (evictions).
      # The desktop sleeps when idle; wol-proxy wakes it on incoming requests.
      nodeSelector:
        kubernetes.io/hostname: homelab-amd-desktop
      tolerations:
        - key: "availability"
          operator: "Equal"
          value: "daytime"
          effect: "NoSchedule"
      containers:
        - name: redis
          image: docker.io/library/redis:8
          ports:
            - containerPort: 6379
          resources:
            limits:
              memory: "256Mi"
              cpu: "200m"
            requests:
              memory: "128Mi"
              cpu: "50m"
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
spec:
  replicas: 1
  # Never run two pods against the same volumes: overlapping pods fight over
  # data/migration_lock ("s6-setlock: Resource busy") during rollouts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      # Pinned to the desktop: the arm nodes run out of memory (evictions).
      # The desktop sleeps when idle; wol-proxy wakes it on incoming requests.
      nodeSelector:
        kubernetes.io/hostname: homelab-amd-desktop
      tolerations:
        - key: "availability"
          operator: "Equal"
          value: "daytime"
          effect: "NoSchedule"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        - name: init-directories
          image: busybox:1.38
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - "sh"
            - "-c"
            - |
              set -e
              echo "Starting directory initialization..."

              # Create directories
              echo "Creating directories..."
              mkdir -p /usr/src/paperless/data/index
              mkdir -p /usr/src/paperless/media/documents/originals
              mkdir -p /usr/src/paperless/media/documents/thumbnails
              mkdir -p /usr/src/paperless/export
              mkdir -p /usr/src/paperless/consume

              # No chown/chmod here: the volumes are CIFS mounts (uid=0,
              # file_mode/dir_mode=0777, noperm), so ownership can't be changed
              # and a recursive walk over media only slows down startup.

              # celery beat keeps its schedule in a sqlite dbm file in the data
              # dir, but sqlite locking doesn't work on CIFS ("database is
              # locked"). Point it at a local emptyDir via a symlink (the mount
              # uses mfsymlinks). The schedule is ephemeral state.
              echo "Linking celery beat schedule to local storage..."
              rm -f /usr/src/paperless/data/celerybeat-schedule.db*
              ln -s /usr/src/paperless/beat/celerybeat-schedule.db /usr/src/paperless/data/celerybeat-schedule.db

              # Verify directories exist and are accessible
              echo "Verifying directory structure..."
              for dir in data media export consume; do
                path="/usr/src/paperless/$dir"
                if [ ! -d "$path" ]; then
                  echo "ERROR: Directory $path does not exist"
                  exit 1
                fi
                echo "✓ $path exists"
              done

              # Test write permissions as root (fsGroup will handle ownership for the main container)
              echo "Testing directory accessibility..."
              for dir in data media export consume; do
                test_file="/usr/src/paperless/$dir/.test-write-$$"
                if ! touch "$test_file"; then
                  echo "ERROR: Cannot create test file in /usr/src/paperless/$dir"
                  exit 1
                fi
                rm -f "$test_file"
                echo "✓ Write test passed for $dir"
              done

              echo "Directory initialization completed successfully!"
          volumeMounts:
            - name: paperless-data
              mountPath: /usr/src/paperless/data
            - name: paperless-media
              mountPath: /usr/src/paperless/media
            - name: paperless-export
              mountPath: /usr/src/paperless/export
            - name: paperless-consume
              mountPath: /usr/src/paperless/consume
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:latest
          ports:
            - containerPort: 8000
          env:
            - name: USERMAP_UID
              value: "1000"
            - name: USERMAP_GID
              value: "1000"
            - name: PAPERLESS_DBUSER
              valueFrom:
                secretKeyRef:
                  name: paperless-db-connection
                  key: username
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-db-connection
                  key: password
          envFrom:
            - configMapRef:
                name: paperless-config
            - secretRef:
                name: paperless-secret-key
            - secretRef:
                name: paperless-oidc
                # Optional: a missing Key Vault entry means Paperless runs without SSO instead of failing to start.
                optional: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: paperless-data
              mountPath: /usr/src/paperless/data
            - name: paperless-media
              mountPath: /usr/src/paperless/media
            - name: paperless-export
              mountPath: /usr/src/paperless/export
            - name: paperless-consume
              mountPath: /usr/src/paperless/consume
            - name: celery-beat
              mountPath: /usr/src/paperless/beat
          resources:
            limits:
              memory: "4Gi"
              cpu: "4"
            requests:
              memory: "1Gi"
              cpu: "500m"
          startupProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: paperless-data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: paperless-media
          persistentVolumeClaim:
            claimName: paperless-media
        - name: paperless-export
          persistentVolumeClaim:
            claimName: paperless-export
        - name: paperless-consume
          persistentVolumeClaim:
            claimName: paperless-consume
        - name: celery-beat
          emptyDir: {}
