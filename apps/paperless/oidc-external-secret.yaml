# authentik OIDC login for Paperless-ngx (django-allauth openid_connect, provider id "authentik").
# The client secret lives only in this Secret (built from Key Vault), never in a ConfigMap or Git.
# Callback: https://docs.timosur.com/accounts/oidc/authentik/login/callback/
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-oidc
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: paperless-oidc
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"OAUTH_PKCE_ENABLED":true,"APPS":[{"provider_id":"authentik","name":"authentik","client_id":"paperless","secret":{{ .oidcClientSecret | toJson }},"settings":{"server_url":"https://auth.timosur.com/application/o/paperless/.well-known/openid-configuration","token_auth_method":"client_secret_basic"}}]}}'
  data:
    - secretKey: oidcClientSecret
      remoteRef:
        key: paperless-oidc-client-secret
