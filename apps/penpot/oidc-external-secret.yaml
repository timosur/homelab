# OIDC client secret for the authentik provider (blueprint apps/authentik/blueprints/penpot.yaml).
# Separate from penpot-secrets so a missing Key Vault entry cannot affect the API secret key.
# Read by the backend as PENPOT_OIDC_CLIENT_SECRET (optional secretKeyRef, see apps/_argocd/penpot-app.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: penpot-oidc
  namespace: penpot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: penpot-oidc
    creationPolicy: Owner
  data:
    - secretKey: clientSecret
      remoteRef:
        key: penpot-oidc-client-secret
