apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: penpot-secrets
  namespace: penpot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: penpot-secrets
    creationPolicy: Owner
  data:
    - secretKey: apiSecretKey
      remoteRef:
        key: penpot-secret-key
