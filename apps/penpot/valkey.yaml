# Penpot uses Valkey only for pub/sub and caching, so no persistence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-valkey
  namespace: penpot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: penpot-valkey
  template:
    metadata:
      labels:
        app: penpot-valkey
    spec:
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:8-alpine
          args: ["valkey-server", "--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-valkey
  namespace: penpot
spec:
  selector:
    app: penpot-valkey
  ports:
    - port: 6379
      targetPort: 6379
