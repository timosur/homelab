apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - external-secret.yaml
  - appdb.yaml
  - valkey.yaml

namespace: penpot

# Copy of the image's /tmp/nginx.conf.template (penpotapp/frontend:2.18.5) with
# worker_processes 2 / worker_connections 4096; re-sync on every Penpot upgrade.
configMapGenerator:
  - name: penpot-frontend-nginx
    files:
      - nginx.conf.template
    options:
      disableNameSuffixHash: true
