apiVersion: v1
kind: ConfigMap
metadata:
  name: atuin-ai-config
  namespace: atuin-ai
data:
  config.toml: |
    port = 8080
    endpoint = "https://inference.ai.home.timosur.com/v1"
    default_model = "claude-haiku-5-5"

    [api_key]
    env = "CHAT_API_KEY"

    [request.body]
    stream_options = { include_usage = true }

    [[models]]
    alias = "claude-haiku-5-5"
    name = "Claude Haiku 5.5"
    description = "Claude Haiku 5.5 via AgentGateway"
    model = "claude-haiku-5-5"

    [[models]]
    alias = "claude-opus-5-5"
    name = "Claude Opus 5.5"
    description = "Claude Opus 5.5 via AgentGateway"
    model = "claude-opus-5-5"

    [[models]]
    alias = "gpt-6-luna"
    name = "GPT-6 Luna"
    description = "GPT-6 Luna via AgentGateway"
    model = "gpt-6-luna"

    [[models]]
    alias = "gpt-6.1-terra"
    name = "GPT-6.1 Terra"
    description = "GPT-6.1 Terra via AgentGateway"
    model = "gpt-6.1-terra"

    [[models]]
    alias = "gpt-6.2-sol"
    name = "GPT-6.2 Sol"
    description = "GPT-6.2 Sol via AgentGateway"
    model = "gpt-6.2-sol"

    [[models]]
    alias = "platform-lab-qwen38"
    name = "Platform Lab Qwen 3.8 27B"
    description = "Platform Lab Qwen 3.8 27B via AgentGateway"
    model = "platform-lab-qwen38"

    [[models]]
    alias = "platform-lab-qwen38-macs"
    name = "Platform Lab Qwen 3.8 27B (Macs)"
    description = "Platform Lab Qwen 3.8 27B (Macs) via AgentGateway"
    model = "platform-lab-qwen38-macs"

    [[models]]
    alias = "platform-lab-qwen38-flash-spark"
    name = "Platform Lab Qwen 3.8 Flash Spark"
    description = "Platform Lab Qwen 3.8 Flash Spark via AgentGateway"
    model = "platform-lab-qwen38-flash-spark"
