apiVersion: apps/v1
kind: Deployment
metadata:
  name: atuin-ai
  namespace: atuin-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atuin-ai
  template:
    metadata:
      labels:
        app: atuin-ai
    spec:
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: atuin-ai
          image: ghcr.io/atuinsh/atuin-ai-server:latest@sha256:3d11028588ebfddb0685169e35cbc7121d3577b6eee3831e845fbe5c28e48d92
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: atuin-ai-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/atuin-ai
              readOnly: true
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: atuin-ai-config
