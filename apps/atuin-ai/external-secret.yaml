apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atuin-ai-secrets
  namespace: atuin-ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: atuin-ai-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTH_TOKEN
      remoteRef:
        key: atuin-ai-auth-token
    - secretKey: CHAT_API_KEY
      remoteRef:
        key: agentgateway-inference-api-key
