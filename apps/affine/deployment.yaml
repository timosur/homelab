apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine
  namespace: affine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: affine
  template:
    metadata:
      labels:
        app: affine
    spec:
      initContainers:
        - name: copy-config
          image: docker.io/library/busybox:1.37
          command:
            [
              'sh',
              '-c',
              'mkdir -p /config && test -f /config/config.json || cp /defaults/config.json /config/config.json',
            ]
          volumeMounts:
            - name: config-data
              mountPath: /config
            - name: config-defaults
              mountPath: /defaults
              readOnly: true
      containers:
        - name: affine
          image: ghcr.io/toeverything/affine:stable
          ports:
            - containerPort: 3010
          env:
            - name: DEPLOYMENT_TYPE
              value: selfhosted
            - name: AFFINE_SERVER_EXTERNAL_URL
              value: https://affine.home.timosur.com
            - name: AFFINE_BACKEND_RUNTIME_CONFIG_PATH
              value: /root/.affine/config/config.json
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: affine-db-connection
                  key: uri
            - name: REDIS_SERVER_HOST
              value: affine-redis
            - name: REDIS_SERVER_PORT
              value: '6379'
            - name: AFFINE_INDEXER_ENABLED
              value: 'false'
          volumeMounts:
            - name: storage
              mountPath: /root/.affine/storage
            - name: config-data
              mountPath: /root/.affine/config
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 2Gi
              cpu: 1
          readinessProbe:
            httpGet:
              path: /api/server/info
              port: 3010
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/server/info
              port: 3010
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: affine-storage
        - name: config-data
          persistentVolumeClaim:
            claimName: affine-storage
        - name: config-defaults
          configMap:
            name: affine-config
---
apiVersion: v1
kind: Service
metadata:
  name: affine
  namespace: affine
spec:
  selector:
    app: affine
  ports:
    - port: 3010
      targetPort: 3010
