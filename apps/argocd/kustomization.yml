apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - https://github.com/argoproj/argo-cd/manifests/cluster-install?ref=v3.6.2
  - oidc-external-secret.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: argocd-(server|repo-server|applicationset-controller|redis|dex-server)
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: homelab-amd
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: ignored
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: homelab-amd
  - target:
      version: v1
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
  - target:
      version: v1
      kind: ConfigMap
      name: argocd-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        url: https://argo.home.timosur.com
        oidc.config: |
          name: authentik
          issuer: https://auth.timosur.com/application/o/argocd/
          clientID: argocd
          clientSecret: $argocd-oidc:clientSecret
          requestedScopes: ["openid", "profile", "email"]
  - target:
      version: v1
      kind: ConfigMap
      name: argocd-rbac-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-rbac-cm
      data:
        policy.default: role:admin
