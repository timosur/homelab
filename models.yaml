# Model onboarding inventory.
# Local entries are pulled/aliased by the amd-gpu Ansible role and served by Ollama
# (Open WebUI); they are not exposed through Agent Gateway.
# Agent Gateway and client model IDs use `id`; Ollama uses `source`.
