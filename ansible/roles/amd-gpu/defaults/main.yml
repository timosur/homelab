---
# AMD GPU configuration
# ROCm is installed for monitoring (rocm-smi) but Ollama uses Vulkan backend
# because ROCm's HIP compute crashes on unsupported GPUs like RX 5700 XT (gfx1010)

rocm_version: "7.2"
amdgpu_install_version: "7.2.70200-1"
ubuntu_codename: "noble" # Ubuntu 24.04

# User to add to render/video groups
gpu_user: timosur
amdgpu_pci_address: "0000:2b:00.0"

# Ollama configuration - use Vulkan backend for RX 5700 XT
# ROCm/HIP causes "illegal memory access" errors on gfx1010
ollama_vulkan: true

# Ollama model storage - use secondary disk to free NVMe SSD for swap
ollama_models_path: /home/timosur/.ollama/models

# RX 5700 XT has 8 GiB VRAM. Serialize requests and limit model residency so
# OpenWebUI background work cannot overcommit VRAM beside an interactive chat.
ollama_context_length: 40960
ollama_num_parallel: 1
ollama_max_loaded_models: 1
ollama_max_queue: 4
ollama_gpu_overhead: 1073741824

# OpenWebUI's large chat model must stay small enough for GPU VRAM.
ollama_bonsai_model: bonsai-27b-local
ollama_title_model: qwen2.5-title-local
ollama_title_context_length: 40960
