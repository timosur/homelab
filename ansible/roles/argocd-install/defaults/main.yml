---
# Default variables for argocd-install role

# Namespace for ArgoCD
argocd_namespace: "argocd"

# The same pinned overlay is used by ArgoCD after bootstrap.
argocd_overlay_path: "{{ playbook_dir }}/../../apps/argocd"

# Explicit recovery override; normal runs leave existing installations alone.
argocd_bootstrap_force: false

# Wait timeout for ArgoCD readiness (seconds)
argocd_wait_timeout: 300
