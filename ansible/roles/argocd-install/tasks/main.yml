---
# tasks file for argocd-install

- name: Verify the overlay namespace
  ansible.builtin.assert:
    that: argocd_namespace == 'argocd'
    fail_msg: The ArgoCD overlay is configured for the argocd namespace.

- name: Create ArgoCD namespace
  kubernetes.core.k8s:
    name: "{{ argocd_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Check for an existing ArgoCD installation
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: argocd-server
    namespace: "{{ argocd_namespace }}"
  register: argocd_existing_server

- name: Check for the ArgoCD self-management application
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: argocd
    namespace: "{{ argocd_namespace }}"
  register: argocd_self_management

- name: Bootstrap ArgoCD from the GitOps overlay
  when: >-
    argocd_bootstrap_force | bool or
    (argocd_existing_server.resources | length == 0 and
     argocd_self_management.resources | default([]) | length == 0)
  block:
    - name: Render the pinned ArgoCD overlay
      ansible.builtin.command:
        argv:
          - kubectl
          - kustomize
          - "{{ argocd_overlay_path }}"
      register: argocd_rendered_overlay
      changed_when: false
      check_mode: false
      no_log: true

    - name: Apply the ArgoCD overlay using server-side apply
      kubernetes.core.k8s:
        state: present
        apply: true
        server_side_apply:
          field_manager: argocd-bootstrap
          force_conflicts: true
        definition: "{{ argocd_rendered_overlay.stdout | from_yaml_all | list }}"
      no_log: true

- name: Wait for ArgoCD server deployment to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: argocd-server
    namespace: "{{ argocd_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: "{{ argocd_wait_timeout }}"

- name: Wait for ArgoCD repo server deployment to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: argocd-repo-server
    namespace: "{{ argocd_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: "{{ argocd_wait_timeout }}"

- name: Wait for ArgoCD ApplicationSet controller deployment to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: argocd-applicationset-controller
    namespace: "{{ argocd_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: "{{ argocd_wait_timeout }}"

- name: Wait for ArgoCD server pods to be ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ argocd_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=argocd-server
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: "{{ argocd_wait_timeout }}"

- name: Wait for ArgoCD repo server pods to be ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ argocd_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=argocd-repo-server
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: "{{ argocd_wait_timeout }}"

- name: Wait for ArgoCD application controller pod to be ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ argocd_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=argocd-application-controller
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: "{{ argocd_wait_timeout }}"

- name: Display ArgoCD admin password instructions
  ansible.builtin.debug:
    msg: |
      ArgoCD has been installed successfully!

      To get the admin password, run:
      kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d

      To access ArgoCD UI:
      kubectl port-forward svc/argocd-server -n {{ argocd_namespace }} 8080:443

      Then open https://localhost:8080 and login with username 'admin'
