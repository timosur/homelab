apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: penpot-home
  namespace: penpot
spec:
  parentRefs:
    - name: envoy-gateway-home
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - penpot.home.timosur.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: penpot
          port: 8080
