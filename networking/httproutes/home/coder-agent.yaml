apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder-agent
  namespace: coder
spec:
  parentRefs:
    - name: envoy-gateway-coder-agent
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - coder.home.timosur.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: coder
          port: 80
