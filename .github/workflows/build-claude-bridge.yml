name: Build and Push Claude Bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-claude-bridge.yml"
      - "services/claude-bridge/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-claude-bridge.yml"
      - "services/claude-bridge/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/claude-bridge

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=claude-bridge-b94bf404

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: services/claude-bridge
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
